{% extends 'tiffin_app/base.html' %}
{% load static %}

{% block title %}Login - Tiffin Service{% endblock %}

{% block content_unauthenticated %}
<style>
.login-container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary-light), #f5f6fa);
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 14px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

.login-header {
    text-align: center;
    margin-bottom: 25px;
}

.login-logo {
    max-height: 70px;
    margin-bottom: 10px;
}

.login-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 5px;
}

.login-subtitle {
    font-size: 14px;
    opacity: 0.7;
}

.form-group {
    margin-bottom: 18px;
}

.form-control {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    font-size: 14px;
}

.form-control:focus {
    border-color: var(--primary);
    outline: none;
    box-shadow: 0 0 0 2px var(--primary-light);
}

.btn-primary {
    background: var(--primary);
    border: none;
    padding: 10px;
    font-weight: 600;
    border-radius: 6px;
    transition: 0.2s;
}

.btn-primary:hover {
    background: var(--primary-dark);
}
</style>


<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            {% if tenant and tenant.logo %}
                <img src="{{ logo_url }}" alt="Logo" class="login-logo">
            {% endif %}
            <h2 class="login-title">{{ tenant_name }}</h2>
            <p class="login-subtitle">Sign in to continue</p>
        </div>
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-full">Login</button>
        </form>
    </div>
</div>
{% endblock %}
