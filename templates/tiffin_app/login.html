{% extends 'tiffin_app/base.html' %}
{% load static %}

{% block title %}Login - Tiffin Service{% endblock %}

{% block content_unauthenticated %}
<style>
.login-container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--primary-light), var(--bg));
    padding: 20px;
}

.login-card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-card);
    padding: 40px 30px;
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
}

.login-header {
    text-align: center;
    margin-bottom: 25px;
}

.login-logo {
    max-height: 70px;
    margin-bottom: 10px;
}

.login-title {
    font-family: 'Fraunces', serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 5px;
    color: var(--text-1);
}

.login-subtitle {
    font-size: 0.875rem;
    color: var(--text-3);
}

.login-container .form-group {
    margin-bottom: 18px;
}
</style>


<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            {% if tenant and tenant.logo %}
                <img src="{{ logo_url }}" alt="Logo" class="login-logo">
            {% endif %}
            <h2 class="login-title">{{ tenant_name }}</h2>
            <p class="login-subtitle">Sign in to continue</p>
        </div>
        
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" required autofocus>
            </div>
            
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-full">Login</button>
        </form>
    </div>
</div>
{% endblock %}
